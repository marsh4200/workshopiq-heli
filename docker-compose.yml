services:
  db:
    image: postgres:16-alpine
    container_name: workshopiq-db
    restart: unless-stopped
    # Tuned for an 8GB host: let Postgres keep hot data in memory instead of
    # the 128MB default. effective_cache_size only informs the query planner.
    command: postgres -c shared_buffers=1GB -c effective_cache_size=3GB
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-workshopiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workshopiq}
      POSTGRES_DB: ${POSTGRES_DB:-workshopiq}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-workshopiq}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/Dockerfile.backend
    container_name: workshopiq-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-workshopiq}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-workshopiq}
      POSTGRES_DB: ${POSTGRES_DB:-workshopiq}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      DEFAULT_ADMIN_USERNAME: ${DEFAULT_ADMIN_USERNAME:-admin}
      DEFAULT_ADMIN_PASSWORD: ${DEFAULT_ADMIN_PASSWORD:-admin}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      WEB_CONCURRENCY: ${WEB_CONCURRENCY:-4}
      # Version comes from the deployed git tag, recorded in .env by update.sh.
      # Empty on a fresh checkout -> backend falls back to its built-in default.
      APP_VERSION: ${APP_VERSION:-}
    volumes:
      - uploads_data:/app/uploads

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: workshopiq-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${APP_PORT:-9918}:9918"

volumes:
  db_data:
  uploads_data:
