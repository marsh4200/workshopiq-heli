server {
    listen 9918;
    server_name _;

    # Allow large uploads (photos, documents, backups)
    client_max_body_size 100M;

    # Compress API JSON responses and text assets on the wire. The job-detail
    # payload and the base64 QR JSON are the big ones; images/zip are already
    # compressed so they're left alone via gzip_types.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        application/json
        application/javascript
        application/xml
        text/css
        text/plain
        image/svg+xml;

    root /usr/share/nginx/html;
    index index.html;

    # API + auth proxy to the FastAPI backend
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        # $host strips the port from the Host header nginx received (it's
        # meant for name-based routing, not for reproducing the exact origin
        # the client connected to) — $http_host is the literal Host header
        # the browser sent, port included. That distinction matters here
        # because the backend uses this Host header to build the QR
        # check-in / inspection-report links when PUBLIC_BASE_URL isn't set,
        # e.g. testing straight off an IP:port with no domain in front yet —
        # with $host those links silently dropped the port and 404'd.
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # Hashed static assets (index-<hash>.js/css) — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # The app shell must NEVER be cached, or browsers/Cloudflare keep serving
    # an old index.html that points at stale JS bundles after an update.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        add_header Pragma "no-cache" always;
        expires -1;
    }

    # SPA fallback — let React Router handle client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
